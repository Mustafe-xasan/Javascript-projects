<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caawiye Notes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="logo-head">
            <img src="./assets/caawiye_logo.png" alt="logo" class="logo-img">
            <h1 class="header">Caawiye</h1>
        </div>

        <div class="input-area">
            <textarea id="noteInput" placeholder="Write something here..."></textarea>
            <button id="addBtn" onclick="addNote()">Add Note <i class="fa fa-plus"></i></button>
        </div>

        <div id="notesList" class="notes-list">
            
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>

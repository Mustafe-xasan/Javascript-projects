<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="container">
        <header>
            <i class="fas fa-shield-halved"></i>
            <h1>Password Generator</h1>
        </header>

        <div class="display-box">
            <input type="text" id="password-display" readonly placeholder="P@ssw0rd123">
            <button id="copy-btn" title="Copy to Clipboard">
                <i class="far fa-copy"></i>
            </button>
        </div>

        <div class="settings-box">
            <div class="setting">
                <label>Password Length: <span id="length-val">12</span></label>
                <input type="range" id="length-slider" min="6" max="30" value="12">
            </div>

            <div class="setting">
                <label for="numbers">Include Numbers</label>
                <input type="checkbox" id="numbers" checked>
            </div>

            <div class="setting">
                <label for="symbols">Include Symbols</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>

        <button id="generate-btn">
            GENERATE PASSWORD <i class="fas fa-bolt"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
